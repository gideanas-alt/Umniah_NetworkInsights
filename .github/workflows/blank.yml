name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Umniah Network Insights
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6

      # ---------------------------------------------------
      # 2. Detect where the Android project actually is
      # ---------------------------------------------------
      - name: Detect Android project folder
        shell: bash
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "Top-level files/folders:"
          ls -la

          SETTINGS_FILE="$(find . -maxdepth 4 -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo ""
          echo "Found Android project at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------
      # 3. JDK 17
      # ---------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------
      # 4. Android SDK command-line tools
      # ---------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ---------------------------------------------------
      # 5. Install Android API 37
      # ---------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          # Compatibility alias for tools expecting android-37
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && \
             [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then

            ln -s \
              "$ANDROID_SDK_ROOT/platforms/android-37.0" \
              "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      # ---------------------------------------------------
      # 6. Gradle 9.6
      # ---------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # ---------------------------------------------------
      # 7. Verify environment
      # ---------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android project:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Android app module:"
          ls -la "$PROJECT_DIR/app"

      # ---------------------------------------------------
      # 8. Build the APK
      # ---------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug \
            2>&1 | tee build.log

      # ---------------------------------------------------
      # 9. Print useful error lines if build fails
      # ---------------------------------------------------
      - name: Show build failure summary
        if: failure()
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/build.log" ]; then
            echo "========================================"
            echo "IMPORTANT BUILD ERRORS"
            echo "========================================"

            grep -nE \
              "FAILURE:|What went wrong|Could not|Caused by:|^e:|error:|Exception|does not contain a Gradle build|Unresolved reference|A problem occurred" \
              "$PROJECT_DIR/build.log" \
              | head -150 || true
          fi

      # ---------------------------------------------------
      # 10. Upload complete Gradle log even on failure
      # ---------------------------------------------------
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Umniah-Gradle-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------
      # 11. Find generated APK
      # ---------------------------------------------------
      - name: Locate generated APK
        if: success()
        shell: bash
        run: |
          echo "Generated APK:"
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------
      # 12. Upload installable APK
      # ---------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Umniah-Network-Insights-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
